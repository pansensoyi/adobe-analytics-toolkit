[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adobe-analytics-toolkit"
version = "0.1.0"
description = "Python toolkit for the Adobe Analytics 2.0 Reporting API: OAuth server-to-server auth, fluent report builder, auto-pagination and tidy row output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ian Pansensoy" }]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
pandas = ["pandas>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/adobe_analytics_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
